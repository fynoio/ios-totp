# .gitlab-ci.yml

stages:
  - validate
  - test
  - secret-detection
  - security

variables:
  # Dependency scanning config
  DS_STAGE: "test"

  # If your Node project is inside backend/, keep this.
  # If your code is in repo root, change to "" or remove.
  DS_INCLUDE_PATHS: "Sources/"

  # Secret detection config
  SECRET_DETECTION_ENABLED: "true"

  GITLAB_API_URL: "https://gitlab.com"

# Security templates
include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sonarqube_scan:
  image: sonarsource/sonar-scanner-cli:5.0.1
  stage: validate
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'
      when: always
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: 0
  before_script: |
    apk add --no-cache curl jq
  script: |
    sonar-scanner --version
    sonar-scanner \
      -Dsonar.projectKey=$SONAR_PROJECT_KEY \
      -Dsonar.sources=. \
      -Dsonar.host.url=$SONAR_HOST_URL \
      -Dsonar.login=$SONAR_TOKEN

    echo "Waiting for SonarQube to process the analysis..."
    sleep 20

    curl -s "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" -u "$SONAR_TOKEN:" \
      | jq -r '.projectStatus.status' > qg_status.txt

    if [ "$(cat qg_status.txt)" != "OK" ]; then
      echo "❌ Custom Quality Gate check failed."
      exit 1
    else
      echo "✅ Custom Quality Gate check passed."
    fi
